<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Anime Max Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#07070d;--bg2:#0f0f18;--card:#15151f;--card2:#1b1b28;--bd:#232332;--bd2:#2e2e42;--tx:#fff;--tx2:#b8b8cc;--tx3:#6f6f8a;--pur:#7c4dff;--pur2:#9d70ff;--blu:#4d9fff;--grn:#4dff9d;--org:#ff9d4d;--red:#ff4d6d;--grd:linear-gradient(135deg,#7c4dff,#4d9fff);--grd2:linear-gradient(135deg,#4dff9d,#4d9fff);--grd3:linear-gradient(135deg,#ff9d4d,#ff4d6d)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(124,77,255,.12),transparent 45%),radial-gradient(circle at 85% 70%,rgba(77,159,255,.1),transparent 45%);z-index:-1;pointer-events:none}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--grd);border-radius:10px}

.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:rgba(11,11,18,.85);backdrop-filter:blur(20px);border-right:1px solid var(--bd);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{font-size:22px;font-weight:900;letter-spacing:-1px;padding:8px 12px 24px;border-bottom:1px solid var(--bd);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.logo b{background:var(--grd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.badge{font-size:9px;font-weight:800;letter-spacing:1.5px;padding:4px 8px;background:rgba(124,77,255,.15);color:var(--pur2);border-radius:6px;border:1px solid rgba(124,77,255,.3)}
nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--tx2);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;background:transparent;border:none;text-align:left;width:100%}
.nav svg{width:18px;height:18px;flex-shrink:0}
.nav:hover{color:#fff;background:rgba(124,77,255,.08)}
.nav.active{color:#fff;background:rgba(124,77,255,.15);box-shadow:inset 3px 0 0 var(--pur)}
.nav.active svg{color:var(--pur2)}
.footer-side{padding-top:16px;border-top:1px solid var(--bd)}
.user{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--grd);display:grid;place-items:center;font-weight:800;font-size:12px;flex-shrink:0}
.user span{flex:1;font-size:11px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout{width:100%;padding:10px;background:rgba(255,77,109,.08);color:var(--red);border:1px solid rgba(255,77,109,.2);border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.logout:hover{background:rgba(255,77,109,.15)}

.main{padding:36px 44px 60px;max-width:1400px}
.hdr{margin-bottom:36px}
.hdr h1{font-size:36px;font-weight:900;letter-spacing:-1.5px;margin-bottom:6px;background:linear-gradient(135deg,#fff 30%,#b8b8cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr p{color:var(--tx3);font-size:15px;font-weight:500}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:40px}
.stat{background:rgba(21,21,31,.7);backdrop-filter:blur(20px);border:1px solid var(--bd2);border-radius:20px;padding:26px;position:relative;overflow:hidden;transition:all .35s cubic-bezier(.16,1,.3,1);cursor:default}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grd);opacity:0;transition:opacity .35s}
.stat:hover{transform:translateY(-6px);border-color:var(--pur);box-shadow:0 24px 48px rgba(0,0,0,.4),0 0 40px rgba(124,77,255,.2)}
.stat:hover::before{opacity:1}
.stat .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:18px;color:#fff}
.stat:nth-child(1) .ico{background:var(--grd)}
.stat:nth-child(2) .ico{background:var(--grd2)}
.stat:nth-child(3) .ico{background:var(--grd3)}
.stat:nth-child(4) .ico{background:linear-gradient(135deg,#7c4dff,#ff4d9d)}
.stat .ico svg{width:26px;height:26px}
.stat .val{font-size:34px;font-weight:900;letter-spacing:-1px;margin-bottom:4px;line-height:1}
.stat .lbl{font-size:11px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:1.5px}

.sec-title{font-size:18px;font-weight:800;letter-spacing:-.5px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd2),transparent)}

.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.qa{display:flex;align-items:center;gap:16px;padding:22px;background:rgba(21,21,31,.7);backdrop-filter:blur(20px);border:1px solid var(--bd2);border-radius:16px;cursor:pointer;transition:all .3s;font-weight:700;font-size:15px}
.qa:hover{transform:translateY(-3px);border-color:var(--pur);background:rgba(124,77,255,.1)}
.qa .ic{width:44px;height:44px;border-radius:12px;background:rgba(124,77,255,.15);display:grid;place-items:center;color:var(--pur2);flex-shrink:0}
.qa .ic svg{width:20px;height:20px}
.qa span{flex:1}
.qa .arrow{color:var(--tx3);transition:transform .3s}
.qa:hover .arrow{transform:translateX(4px);color:var(--pur2)}

@media(max-width:900px){
    .layout{grid-template-columns:1fr}
    .sidebar{display:none}
    .main{padding:24px 20px 60px}
    .hdr h1{font-size:26px}
    .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="logo">ANIME <b>MAX</b><span class="badge">ADMIN</span></div>
        <nav>
            <button class="nav active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                Dashboard
            </button>
            <a href="list.html" class="nav">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                Video & Movies
            </a>
            <a href="anime-title.html" class="nav">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Anime Title
            </a>
            <a href="upload.html" class="nav">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Upload
            </a>
        </nav>
        <div class="footer-side">
            <div class="user"><div class="avatar" id="av">A</div><span id="em">admin</span></div>
            <button class="logout" id="lo">Sign Out</button>
        </div>
    </aside>

    <main class="main">
        <div class="hdr">
            <h1>Dashboard</h1>
            <p>Welcome back! Here's your content overview.</p>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><polygon points="22 8 16 12 22 16 22 8"/></svg></div>
                <div class="val" id="t1">0</div>
                <div class="lbl">Total Content</div>
            </div>
            <div class="stat">
                <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg></div>
                <div class="val" id="t2">0</div>
                <div class="lbl">Series</div>
            </div>
            <div class="stat">
                <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 8h16"/></svg></div>
                <div class="val" id="t3">0</div>
                <div class="lbl">Movies</div>
            </div>
            <div class="stat">
                <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg></div>
                <div class="val" id="t4">0</div>
                <div class="lbl">Episodes</div>
            </div>
        </div>

        <div class="sec-title">Quick Actions</div>
        <div class="quick">
            <a href="anime-title.html" class="qa">
                <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
                <span>Add New Anime</span>
                <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
            <a href="upload.html" class="qa">
                <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
                <span>Upload Episode</span>
                <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
            <a href="list.html" class="qa">
                <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg></div>
                <span>View All Content</span>
                <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
        </div>
    </main>
</div>

<script>
const CFG={apiKey:"AIzaSyCpfrluxsBhnz48ve9RykIy1IxzbBfk7dA",authDomain:"sm-studio-7.firebaseapp.com",databaseURL:"https://sm-studio-7-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"sm-studio-7",storageBucket:"sm-studio-7.firebasestorage.app",messagingSenderId:"126291501472",appId:"1:126291501472:web:a55c94b5b87581177204c5"};
const ADMIN_EMAIL='admin@animemax.com';
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id);

auth.onAuthStateChanged(u=>{
    if(!u||u.email!==ADMIN_EMAIL){location.href='index.html';return;}
    $('em').textContent=u.email;$('av').textContent=u.email[0].toUpperCase();
    load();
});

$('lo').addEventListener('click',()=>auth.signOut());

async function load(){
    try{
        const s=await db.ref('animes').once('value');
        const d=s.val()||{};
        const items=Object.entries(d).map(([id,a])=>({id,...a}));
        $('t1').textContent=items.length;
        $('t2').textContent=items.filter(a=>(a.type||'series')==='series').length;
        $('t3').textContent=items.filter(a=>a.type==='movie').length;
        let eps=0;items.forEach(a=>{if(a.episodes)eps+=Object.keys(a.episodes).length;});
        $('t4').textContent=eps;
    }catch(e){console.error(e);}
}
</script>
</body>
</html>

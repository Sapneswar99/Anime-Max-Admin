<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b12">
    <meta name="description" content="Anime List — Anime Max Admin Panel">
    <meta name="robots" content="noindex, nofollow">

    <title>Anime List | Anime Max</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body class="admin-body" data-page="anime-list">

    <!-- LOADING SCREEN -->
    <div id="pageLoader" class="page-loader" role="status" aria-live="polite">
        <div class="loader-content">
            <div class="loader-logo">
                <span>ANIME</span>
                <strong>MAX</strong>
            </div>
            <div class="loader-spinner"></div>
            <p>Loading Anime List...</p>
        </div>
    </div>

    <!-- NOTIFICATION -->
    <div id="notificationMessage" class="notification-message" role="status" aria-live="polite" hidden></div>

    <!-- ADMIN APPLICATION -->
    <div id="adminApp" class="admin-app" hidden>

        <!-- HEADER -->
        <header class="admin-header">
            <a href="index.html" class="header-brand" aria-label="Anime Max Dashboard">
                <span>ANIME</span>
                <strong>MAX</strong>
            </a>

            <div class="header-actions">
                <button type="button" class="icon-button" id="headerNotificationButton"
                        data-page="notifications" aria-label="Notifications">
                    <i class="fa fa-bell" aria-hidden="true"></i>
                </button>

                <a href="profile.html" class="profile-avatar" aria-label="Admin profile">
                    <i class="fa fa-user" aria-hidden="true"></i>
                </a>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main id="adminMainContent" class="admin-main">

            <div class="page-heading">
                <div>
                    <span class="section-label">CONTENT</span>
                    <h1>Anime List</h1>
                    <p>Saari anime series manage karein. Edit icon par tap karke change karein.</p>
                </div>

                <button type="button" id="addAnimeButton" class="icon-button" aria-label="Add Anime">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>

            <!-- CONTENT CARD -->
            <section class="content-card">

                <!-- SEARCH -->
                <div class="management-toolbar">
                    <input
                        id="animeListSearch"
                        class="management-search"
                        type="search"
                        placeholder="Search anime by title or genre..."
                        aria-label="Search anime">
                </div>

                <!-- ANIME GRID -->
                <div id="animeListGrid" class="management-grid">
                    <div class="management-empty">Loading anime list...</div>
                </div>

            </section>

            <footer class="admin-footer">
                <p>&copy; <span id="currentYear"></span> Anime Max Admin Panel</p>
            </footer>

        </main>

        <!-- =================================================
             FIXED BOTTOM NAVIGATION (5 ITEMS)
        ================================================== -->
        <nav class="bottom-navigation" id="bottomNavigation" aria-label="Main navigation">

            <a href="index.html" class="bottom-nav-link">
                <i class="fa fa-th-large" aria-hidden="true"></i>
                <span>Dashboard</span>
            </a>

            <a href="anime-list.html" class="bottom-nav-link active" aria-current="page">
                <i class="fa fa-list" aria-hidden="true"></i>
                <span>Anime List</span>
            </a>

            <a href="upload.html" class="bottom-nav-link">
                <i class="fa fa-cloud-upload" aria-hidden="true"></i>
                <span>Upload</span>
            </a>

            <a href="anime-title.html" class="bottom-nav-link">
                <i class="fa fa-television" aria-hidden="true"></i>
                <span>Anime Title</span>
            </a>

            <a href="profile.html" class="bottom-nav-link">
                <i class="fa fa-user" aria-hidden="true"></i>
                <span>Profile</span>
            </a>

        </nav>

        <!-- Admin details for JavaScript compatibility -->
        <span id="sidebarAdminName" hidden>Administrator</span>
        <span id="sidebarAdminEmail" hidden>Admin Account</span>
    </div>

    <!-- MAIN JAVASCRIPT -->
    <script type="module" src="js/script.js"></script>

</body>
</html>

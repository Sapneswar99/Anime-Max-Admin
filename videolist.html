<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video List - Anime Max Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#07070d;--bg2:#0f0f18;--card:#15151f;--card2:#1b1b28;--bd:#232332;--bd2:#2e2e42;--tx:#fff;--tx2:#b8b8cc;--tx3:#6f6f8a;--pur:#7c4dff;--pur2:#9d70ff;--blu:#4d9fff;--grn:#4dff9d;--org:#ff9d4d;--red:#ff4d6d;--grd:linear-gradient(135deg,#7c4dff,#4d9fff);--grd2:linear-gradient(135deg,#4dff9d,#4d9fff);--grd3:linear-gradient(135deg,#ff9d4d,#ff4d6d)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(124,77,255,.12),transparent 45%),radial-gradient(circle at 85% 70%,rgba(77,159,255,.1),transparent 45%);z-index:-1;pointer-events:none}
a{color:inherit;text-decoration:none}
button,input,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--grd);border-radius:10px}

.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:rgba(11,11,18,.85);backdrop-filter:blur(20px);border-right:1px solid var(--bd);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{font-size:22px;font-weight:900;letter-spacing:-1px;padding:8px 12px 24px;border-bottom:1px solid var(--bd);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.logo b{background:var(--grd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.badge{font-size:9px;font-weight:800;letter-spacing:1.5px;padding:4px 8px;background:rgba(124,77,255,.15);color:var(--pur2);border-radius:6px;border:1px solid rgba(124,77,255,.3)}
nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--tx2);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;background:transparent;border:none;text-align:left;width:100%}
.nav svg{width:18px;height:18px;flex-shrink:0}
.nav:hover{color:#fff;background:rgba(124,77,255,.08)}
.nav.active{color:#fff;background:rgba(124,77,255,.15);box-shadow:inset 3px 0 0 var(--pur)}
.nav.active svg{color:var(--pur2)}
.footer-side{padding-top:16px;border-top:1px solid var(--bd)}
.user{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--grd);display:grid;place-items:center;font-weight:800;font-size:12px;flex-shrink:0}
.user span{flex:1;font-size:11px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout{width:100%;padding:10px;background:rgba(255,77,109,.08);color:var(--red);border:1px solid rgba(255,77,109,.2);border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.logout:hover{background:rgba(255,77,109,.15)}

.main{padding:36px 44px 60px;max-width:1400px}
.hdr{margin-bottom:28px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px}
.hdr h1{font-size:36px;font-weight:900;letter-spacing:-1.5px;margin-bottom:6px;background:linear-gradient(135deg,#fff 30%,#b8b8cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr p{color:var(--tx3);font-size:15px;font-weight:500}
.btn-add{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;background:var(--grd);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .25s;box-shadow:0 8px 24px rgba(124,77,255,.35);text-decoration:none}
.btn-add:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(124,77,255,.5)}
.btn-add svg{width:18px;height:18px}

/* Controls */
.controls{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:220px;position:relative}
.search-box svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--tx3);pointer-events:none}
.search-box input{width:100%;padding:14px 16px 14px 46px;background:rgba(21,21,31,.7);border:1.5px solid var(--bd2);border-radius:12px;color:var(--tx);font-size:14px;font-weight:500;outline:none;transition:all .25s}
.search-box input:focus{border-color:var(--pur);background:rgba(124,77,255,.08);box-shadow:0 0 0 4px rgba(124,77,255,.12)}
.search-box input::placeholder{color:var(--tx3)}
.filter-select{padding:14px 18px;background:rgba(21,21,31,.7);border:1.5px solid var(--bd2);border-radius:12px;color:var(--tx);font-size:14px;font-weight:600;outline:none;cursor:pointer;transition:all .25s;min-width:180px}
.filter-select:focus{border-color:var(--pur)}
.filter-select option{background:var(--card);color:var(--tx)}
.count-badge{padding:10px 18px;background:rgba(124,77,255,.12);border:1px solid rgba(124,77,255,.3);border-radius:12px;font-size:13px;font-weight:700;color:var(--pur2);white-space:nowrap}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:rgba(21,21,31,.7);backdrop-filter:blur(20px);border:1px solid var(--bd2);border-radius:16px;overflow:hidden;transition:all .3s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:var(--pur);box-shadow:0 20px 40px rgba(0,0,0,.4),0 0 30px rgba(124,77,255,.15)}
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#1b1b28,#15151f);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .thumb img{transform:scale(1.06)}
.thumb .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;opacity:0;transition:opacity .3s}
.card:hover .play-overlay{opacity:1}
.play-overlay svg{width:48px;height:48px;color:#fff;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.ep-badge{position:absolute;top:10px;left:10px;padding:4px 10px;background:rgba(124,77,255,.9);color:#fff;font-size:11px;font-weight:800;border-radius:6px;letter-spacing:.5px}
.dur-badge{position:absolute;bottom:10px;right:10px;padding:4px 10px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:700;border-radius:6px}

.card-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-title{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-anime{font-size:12px;color:var(--tx3);font-weight:600;display:flex;align-items:center;gap:6px}
.card-anime svg{width:12px;height:12px;color:var(--pur2)}

.card-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
.act{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd2);background:rgba(255,255,255,.03);color:var(--tx2);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.act svg{width:14px;height:14px}
.act:hover{background:rgba(124,77,255,.12);border-color:var(--pur);color:#fff}
.act.del:hover{background:rgba(255,77,109,.12);border-color:var(--red);color:var(--red)}

.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--tx3)}
.empty svg{width:64px;height:64px;margin-bottom:16px;opacity:.4}
.empty h3{font-size:18px;font-weight:700;color:var(--tx2);margin-bottom:6px}
.empty p{font-size:14px}

.loader{grid-column:1/-1;text-align:center;padding:60px}
.spinner{width:40px;height:40px;border:3px solid var(--bd2);border-top-color:var(--pur);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:900px){
    .layout{grid-template-columns:1fr}
    .sidebar{display:none}
    .main{padding:24px 20px 60px}
    .hdr h1{font-size:26px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
}
</style>
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="logo">ANIME <b>MAX</b><span class="badge">ADMIN</span></div>
        <nav>
            <a href="dashboard.html" class="nav">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                Dashboard
            </a>
            <a href="list.html" class="nav">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                Video & Movies
            </a>
            <a href="videolist.html" class="nav active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/></svg>
                Video List
            </a>
            <a href="anime-title.html" class="nav">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Anime Title
            </a>
            <a href="upload.html" class="nav">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Upload
            </a>
        </nav>
        <div class="footer-side">
            <div class="user"><div class="avatar" id="av">A</div><span id="em">admin</span></div>
            <button class="logout" id="lo">Sign Out</button>
        </div>
    </aside>

    <main class="main">
        <div class="hdr">
            <div>
                <h1>Video List</h1>
                <p>Manage all episodes and videos across your content.</p>
            </div>
            <a href="upload.html" class="btn-add">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Upload New
            </a>
        </div>

        <div class="controls">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search" placeholder="Search by title or anime...">
            </div>
            <select class="filter-select" id="filterAnime">
                <option value="">All Anime</option>
            </select>
            <div class="count-badge" id="count">0 Videos</div>
        </div>

        <div class="grid" id="grid">
            <div class="loader"><div class="spinner"></div><p>Loading videos...</p></div>
        </div>
    </main>
</div>

<script>
const CFG={apiKey:"AIzaSyCpfrluxsBhnz48ve9RykIy1IxzbBfk7dA",authDomain:"sm-studio-7.firebaseapp.com",databaseURL:"https://sm-studio-7-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"sm-studio-7",storageBucket:"sm-studio-7.firebasestorage.app",messagingSenderId:"126291501472",appId:"1:126291501472:web:a55c94b5b87581177204c5"};
const ADMIN_EMAIL='sapneswarmajhi45@gmail.com';
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id);

let allVideos=[];

auth.onAuthStateChanged(u=>{
    if(!u||u.email!==ADMIN_EMAIL){location.href='index.html';return;}
    $('em').textContent=u.email;$('av').textContent=u.email[0].toUpperCase();
    loadVideos();
});

$('lo').addEventListener('click',()=>auth.signOut());

async function loadVideos(){
    try{
        const snap=await db.ref('animes').once('value');
        const data=snap.val()||{};
        allVideos=[];

        Object.entries(data).forEach(([animeId,anime])=>{
            const animeTitle=anime.title||anime.name||'Unknown Anime';
            const episodes=anime.episodes||{};
            Object.entries(episodes).forEach(([epId,ep])=>{
                allVideos.push({
                    id:epId,
                    animeId,
                    animeTitle,
                    title:ep.title||ep.name||`Episode ${ep.episodeNumber||''}`,
                    thumbnail:ep.thumbnail||ep.thumb||'',
                    videoUrl:ep.videoUrl||ep.url||'',
                    episodeNumber:ep.episodeNumber||ep.ep||'',
                    duration:ep.duration||'',
                    createdAt:ep.createdAt||0
                });
            });
        });

        // Sort newest first
        allVideos.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

        populateAnimeFilter();
        render();

        $('search').addEventListener('input',render);
        $('filterAnime').addEventListener('change',render);
    }catch(e){
        console.error(e);
        $('grid').innerHTML=`<div class="empty"><h3>Error loading videos</h3><p>${e.message}</p></div>`;
    }
}

function populateAnimeFilter(){
    const select=$('filterAnime');
    const animes=[...new Set(allVideos.map(v=>v.animeTitle))].sort();
    select.innerHTML='<option value="">All Anime</option>'+animes.map(a=>`<option value="${a}">${a}</option>`).join('');
}

function render(){
    const q=$('search').value.trim().toLowerCase();
    const animeFilter=$('filterAnime').value;
    const grid=$('grid');

    let filtered=allVideos.filter(v=>{
        const matchSearch=!q||v.title.toLowerCase().includes(q)||v.animeTitle.toLowerCase().includes(q);
        const matchAnime=!animeFilter||v.animeTitle===animeFilter;
        return matchSearch&&matchAnime;
    });

    $('count').textContent=`${filtered.length} Video${filtered.length!==1?'s':''}`;

    if(!filtered.length){
        grid.innerHTML=`<div class="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9l5 3-5 3V9z"/></svg>
            <h3>No videos found</h3>
            <p>Try adjusting your search or filter.</p>
        </div>`;
        return;
    }

    grid.innerHTML=filtered.map(v=>{
        const thumb=v.thumbnail||'';
        const epLabel=v.episodeNumber?`EP ${v.episodeNumber}`:'';
        const dur=v.duration?`<span class="dur-badge">${v.duration}</span>`:'';
        return `
        <div class="card">
            <div class="thumb">
                ${thumb?`<img src="${thumb}" alt="${escapeHtml(v.title)}" loading="lazy" onerror="this.style.display='none'">`:''}
                <div class="play-overlay">
                    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" opacity=".3"/><polygon points="10 8 16 12 10 16 10 8" fill="#fff"/></svg>
                </div>
                ${epLabel?`<span class="ep-badge">${epLabel}</span>`:''}
                ${dur}
            </div>
            <div class="card-body">
                <div class="card-title">${escapeHtml(v.title)}</div>
                <div class="card-anime">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>
                    ${escapeHtml(v.animeTitle)}
                </div>
                <div class="card-actions">
                    <a href="upload.html?anime=${v.animeId}&episode=${v.id}" class="act">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        Edit
                    </a>
                    <button class="act del" onclick="deleteVideo('${v.animeId}','${v.id}','${escapeHtml(v.title).replace(/'/g,"\\'")}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        Delete
                    </button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function deleteVideo(animeId,epId,title){
    if(!confirm(`Delete "${title}"?\n\nThis cannot be undone.`))return;
    try{
        await db.ref(`animes/${animeId}/episodes/${epId}`).remove();
        allVideos=allVideos.filter(v=>!(v.animeId===animeId&&v.id===epId));
        render();
    }catch(e){
        alert('Delete failed: '+e.message);
    }
}
</script>
</body>
</html>

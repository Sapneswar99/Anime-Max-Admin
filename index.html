<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Anime Max</title>
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="login-screen">
    <div class="login-card">
        <div class="login-logo"><span>ANIME</span><strong>MAX</strong></div>
        <h1>Admin Login</h1>
        <p>Enter your admin credentials</p>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
            <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
            <button type="submit" class="btn-primary">Login</button>
        </form>
        <p id="loginError" class="login-error"></p>
    </div>
</div>

<script>
    const ADMIN_EMAIL = 'admin@animemax.com';
    const FIREBASE_CONFIG = {
        apiKey: "AIzaSyCpfrluxsBhnz48ve9RykIy1IxzbBfk7dA",
        authDomain: "sm-studio-7.firebaseapp.com",
        databaseURL: "https://sm-studio-7-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "sm-studio-7",
        storageBucket: "sm-studio-7.firebasestorage.app",
        messagingSenderId: "126291501472",
        appId: "1:126291501472:web:a55c94b5b87581177204c5"
    };

    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();

    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    // If already logged in, redirect
    auth.onAuthStateChanged((user) => {
        if (user && user.email === ADMIN_EMAIL) {
            window.location.href = 'dashboard.html';
        }
    });

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginError.textContent = '';
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (email !== ADMIN_EMAIL) {
            loginError.textContent = 'Not an admin account.';
            return;
        }

        try {
            await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
            const c = err.code || '';
            if (c.includes('user-not-found')) loginError.textContent = 'No admin account.';
            else if (c.includes('wrong-password')) loginError.textContent = 'Wrong password.';
            else loginError.textContent = 'Login failed.';
        }
    });
</script>
</body>
</html>

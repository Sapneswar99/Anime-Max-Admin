<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
<style>
body{background:#07070d;color:#fff;font-family:'Inter',sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}
.spinner{width:44px;height:44px;border:3px solid rgba(124,77,255,.2);border-top-color:#7c4dff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div>
    <div class="spinner"></div>
    <p style="color:#a5a5b3">Redirecting to edit page...</p>
</div>
<script>
const id = new URLSearchParams(location.search).get('id');
location.replace(id ? 'anime-title.html?id=' + encodeURIComponent(id) : 'list.html');
</script>
</body>
</html>
